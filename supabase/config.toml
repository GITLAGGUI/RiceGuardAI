project_id = "pekowozxnyyeskymjxyx"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# GABAY: seed.sql muna (gumagawa ng local admin), tapos ang dalawang migration na nangangailangan ng admin para
# mailagay ang official advisory sources sa bagong local database. Hindi ito tumatakbo sa production.
sql_paths = [
  "./seed.sql",
  "./migrations/20260929111000_seed_official_advisory_sources.sql",
  "./migrations/20260930110000_context_aware_advisories.sql",
]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://riceguard.vercel.app", "http://localhost:5181"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.mfa]
# GABAY: Gaya sa production, kailangan ng authenticator app (TOTP) ang admin bago makapag-edit/delete/upload.
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "RiceGuard: Iyong code ay {{ .Code }}. Wag ibahagi."
max_frequency = "60s"

[auth.sms.test_otp]
# Only this synthetic local test number matches OTP `123456`.
"+639000000000" = "123456"

# Local SMS delivery is opt-in. Enable this hook only after loading the signing
# secret into the local environment and setting secrets = "env(SEND_SMS_HOOK_SECRETS)".
# Keep it disabled for read-only linked CLI commands; no placeholder secret is used.
# Remote Auth hooks are managed separately and are NOT changed by this file.
[auth.hook.send_sms]
enabled = false
uri = "http://host.docker.internal:54321/functions/v1/auth-sms-hook"
secrets = ""

[functions.auth-sms-hook]
verify_jwt = false

[functions.send-sms]
verify_jwt = false

[functions.sms-webhook]
verify_jwt = false

[functions.ai-advisor]
verify_jwt = true

[functions.weather]
verify_jwt = true

# Cron callers authenticate with a dedicated CRON_SECRET instead of a user JWT.
[functions.job-dispatcher]
verify_jwt = false

[functions.job-reconciler]
verify_jwt = false

[functions.aws-dispatcher]
verify_jwt = false

[functions.aws-reconciler]
verify_jwt = false

# Workers use short-lived, per-job bearer tokens validated by the
# function against the stored token hash and expiry.
[functions.worker-callback]
verify_jwt = false

[functions.public-assistant]
verify_jwt = false

# This isolated endpoint validates opaque OAuth grants itself. Default disabled
# unless RG_GEMINI_CONNECTOR_ENABLED and the owner UUID are configured privately.
[functions.advisory-mcp]
verify_jwt = false

[functions.advisory-notifier]
verify_jwt = false

[functions.auto-pipeline]
verify_jwt = false

[analytics]
# GABAY: Naka-off sa local. Sa Windows, kailangan nito ang Docker sa tcp://localhost:2375 at madalas itong nagpapabagal o nagpapapalya sa `supabase start`.
enabled = false
